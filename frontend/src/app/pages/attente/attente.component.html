<div class="thread-container">
  <div class="file-bubble">
    <div class="file-icon-box">DOC</div>
    <div class="file-meta">
      <div class="file-name">{{ filename }}</div>
      <div class="file-sub">Analyse de votre bilan en cours</div>
    </div>
  </div>

  <div class="assistant-card wait-card">
    <div class="loader-ring" aria-hidden="true"></div>
    <h2>{{ activeMessage }}</h2>
    <p class="wait-desc">Merci de patienter quelques instants pendant la préparation de votre synthèse.</p>

    <div
      class="progress-track"
      role="progressbar"
      [attr.aria-valuenow]="progressPercent"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>

    <ol class="pipeline-steps" aria-label="Étapes de traitement">
      @for (step of stages; track step; let idx = $index) {
        <li
          class="pipeline-step"
          [class.step-done]="idx < stageIndex"
          [class.step-active]="idx === stageIndex"
        >
          <span class="step-dot" aria-hidden="true">{{ idx < stageIndex ? '✓' : idx + 1 }}</span>
          <span class="step-label">{{ step }}</span>
        </li>
      }
    </ol>

    <button type="button" class="btn btn-ghost" (click)="cancelAndReturn()">
      Annuler
    </button>
  </div>
</div>
